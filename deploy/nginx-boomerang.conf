# BOOMERANG : https://boomerang.65-20-103-177.sslip.io  (Next.js site on 127.0.0.1:5401)
# The Telegram bot + scheduler (backend, :5400) stays local; the site has its own API routes.
server {
    listen 80;
    listen [::]:80;
    server_name boomerang.65-20-103-177.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boomerang.65-20-103-177.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/boomerang.65-20-103-177.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boomerang.65-20-103-177.sslip.io/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
